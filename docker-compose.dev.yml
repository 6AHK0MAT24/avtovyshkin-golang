version: '3.8'

services:
  postgres:
    image: postgres:13.3
    container_name: avtovyshkin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-avtovyshkin_db_go}
    ports:
      - "${POSTGRES_CONTAINER_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/drivers-microservice/migrations:/docker-entrypoint-initdb.d/01-drivers
      - ./backend/vehicles-microservice/migrations:/docker-entrypoint-initdb.d/02-vehicles    networks:
      - avtovyshkin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  avtovyshkin-network:
    driver: bridge
