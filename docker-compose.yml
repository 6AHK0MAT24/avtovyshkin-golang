version: '3.8'

services:
  postgres:
    image: postgres:13.3
    container_name: avtovyshkin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-avtovyshkin_db_go}
    ports:
      - "${POSTGRES_CONTAINER_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/drivers-microservice/migrations:/docker-entrypoint-initdb.d/01-drivers
      - ./backend/vehicles-microservice/migrations:/docker-entrypoint-initdb.d/02-vehicles
    networks:
      - avtovyshkin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  drivers-microservice:
    build:
      context: ./backend/drivers-microservice
      dockerfile: Dockerfile
    container_name: avtovyshkin-drivers-microservice
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-avtovyshkin_db_go}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Content-Type,Authorization,X-Requested-With
      ALLOWED_FILE_TYPES: jpg,jpeg,png,gif,webp,bmp,tiff,svg,pdf
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - avtovyshkin-network
    volumes:
      - ./backend/drivers-microservice/uploads:/app/uploads

  vehicles-microservice:
    build:
      context: ./backend/vehicles-microservice
      dockerfile: Dockerfile
    container_name: avtovyshkin-vehicles-microservice
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-avtovyshkin_db_go}
      SERVER_PORT: ${VEHICLES_SERVER_PORT:-8081}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Content-Type,Authorization,X-Requested-With
      ALLOWED_FILE_TYPES: jpg,jpeg,png,gif,webp,bmp,tiff,svg,pdf
    ports:
      - "${VEHICLES_SERVER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - avtovyshkin-network
    volumes:
      - ./backend/vehicles-microservice/uploads:/app/uploads

  # Frontend - только для production (nginx + статику)
  # Для разработки используйте: cd frontend && yarn dev
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${SERVER_PORT:-8080}
        VITE_WS_BASE_URL: ws://localhost:${SERVER_PORT:-8080}
    container_name: avtovyshkin-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - drivers-microservice
    networks:
      - avtovyshkin-network
    profiles:
      - production

volumes:
  postgres_data:

networks:
  avtovyshkin-network:
    driver: bridge
